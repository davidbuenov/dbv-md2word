name: Test dbv-md2word Action

on:
  push:
    branches:
      - master
    paths:
      - 'README.md'
      - '.github/workflows/convert-docs.yml'

jobs:
  test-conversion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert README.md to Word
        uses: ./
        with:
          source: 'README.md'
          output: 'dist/README.docx'

      - name: Upload docx as artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-readme
          path: dist/README.docx
